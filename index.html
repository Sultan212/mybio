<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim İlk Sitem</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }
        header {
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
        }
        .container {
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            border: none;
            background: white;
            color: black;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

<header>
    🌐 Benim Web Sitem
</header>

<div class="container">
    <h1>Hoşgeldin!</h1>
    <p>Bu siteyi ben yaptım 🚀</p>
    <button onclick="mesaj()">Bana Tıkla</button>
</div>

<script>
    function mesaj() {
        alert("Tebrikler! JavaScript çalışıyor 😎");
    }
</script>

</body>
</html>
